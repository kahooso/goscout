# CI для goscout.
# Запускается на каждый push и pull request в main.
# Что проверяет:
#   - go vet  — статический анализ; ловит подозрительные конструкции
#                (например, неправильный %d для строки в fmt.Printf)
#   - go test -race  — прогон всех тестов с детектором гонок
#                       обязательно для concurrency-кода (горутины, каналы)
# Если хоть одно падает — PR красный, мердж заблокирован.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...
